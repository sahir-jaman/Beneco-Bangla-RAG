<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Beneco বাংলা AI বন্ধু</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ---------- colours: light (default) ---------- */
  :root {
    --page: #f4f4f5;
    --surface: #ffffff;
    --text: #111111;
    --muted: #71717a;
    --border: #e4e4e7;
    --bot-bg: #f4f4f5;
    --user-bg: #111111;
    --user-text: #ffffff;
    --accent: #111111;
    --accent-text: #ffffff;
  }
  /* ---------- colours: dark (follows the device setting) ---------- */
  @media (prefers-color-scheme: dark) {
    :root {
      --page: #000000;
      --surface: #0a0a0a;
      --text: #f4f4f5;
      --muted: #a1a1aa;
      --border: #27272a;
      --bot-bg: #18181b;
      --user-bg: #f4f4f5;
      --user-text: #111111;
      --accent: #f4f4f5;
      --accent-text: #111111;
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Hind Siliguri", system-ui, sans-serif;
    background: var(--page);
    color: var(--text);
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* ---------- layout ---------- */
  .chat {
    width: 100%;
    height: 100dvh;                  /* full screen on phones */
    display: flex;
    flex-direction: column;
    background: var(--surface);
  }
  @media (min-width: 768px) {        /* laptops: centred card */
    .chat {
      max-width: 720px;
      height: calc(100dvh - 48px);
      border: 1px solid var(--border);
      border-radius: 20px;
      overflow: hidden;
    }
  }

  /* ---------- header ---------- */
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 20px;
    padding-top: max(16px, env(safe-area-inset-top));
    border-bottom: 1px solid var(--border);
  }
  .logo {
    width: 40px; height: 40px; flex-shrink: 0;
    border-radius: 12px;
    background: var(--accent); color: var(--accent-text);
    display: grid; place-items: center;
    font-weight: 600; font-size: 18px;
  }
  header h1 { font-size: 16px; font-weight: 600; line-height: 1.3; }
  .status { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .status::before {
    content: ""; width: 7px; height: 7px; border-radius: 50%; background: #22c55e;
  }

  /* ---------- messages ---------- */
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  @media (min-width: 768px) { #messages { padding: 28px 28px; } }

  .msg {
    max-width: 85%;
    padding: 11px 15px;
    border-radius: 18px;
    font-size: 15px;
    line-height: 1.65;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  @media (min-width: 768px) { .msg { max-width: 75%; } }
  .bot  { align-self: flex-start; background: var(--bot-bg); border-bottom-left-radius: 6px; }
  .user { align-self: flex-end; background: var(--user-bg); color: var(--user-text); border-bottom-right-radius: 6px; }

  .sources {
    margin-top: 10px;
    padding-top: 8px;
    border-top: 1px solid var(--border);
    font-size: 12px;
    color: var(--muted);
    white-space: normal;
  }
  .sources a {
    display: block;
    color: var(--muted);
    text-decoration: underline;
    text-underline-offset: 2px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    line-height: 1.8;
  }
  .sources a:hover { color: var(--text); }

  .typing { display: flex; gap: 5px; padding: 16px 18px; }
  .typing span {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--muted); animation: blink 1.2s infinite;
  }
  .typing span:nth-child(2) { animation-delay: .2s; }
  .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }

  /* ---------- suggestions ---------- */
  #suggestions {
    display: flex; gap: 8px;
    padding: 0 16px 12px;
    overflow-x: auto;                 /* sideways scroll on phones */
    scrollbar-width: none;
  }
  #suggestions::-webkit-scrollbar { display: none; }
  @media (min-width: 768px) { #suggestions { flex-wrap: wrap; padding: 0 28px 14px; } }
  #suggestions button {
    flex-shrink: 0;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    border-radius: 999px;
    padding: 7px 14px;
    font: inherit; font-size: 14px;
    cursor: pointer;
    transition: border-color .15s;
  }
  #suggestions button:hover { border-color: var(--text); }

  /* ---------- input ---------- */
  form {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 16px;
    padding-bottom: max(12px, env(safe-area-inset-bottom));
    border-top: 1px solid var(--border);
  }
  @media (min-width: 768px) { form { padding: 14px 28px; } }
  input {
    flex: 1; min-width: 0;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    border-radius: 999px;
    padding: 12px 18px;
    font: inherit;
    font-size: 16px;                 /* 16px stops iPhone zooming in */
    outline: none;
    transition: border-color .15s;
  }
  input::placeholder { color: var(--muted); }
  input:focus { border-color: var(--text); }
  .send {
    width: 46px; height: 46px; flex-shrink: 0;
    border: none; border-radius: 50%;
    background: var(--accent); color: var(--accent-text);
    display: grid; place-items: center;
    cursor: pointer;
  }
  .send:disabled { opacity: .35; cursor: not-allowed; }
  .send svg { width: 20px; height: 20px; }

  .note {
    font-size: 12px; color: var(--muted);
    text-align: center;
    padding: 0 16px 10px;
  }
</style>
</head>
<body>
<div class="chat">
  <header>
    <div class="logo">B</div>
    <div>
      <h1>Beneco বাংলা AI বন্ধু</h1>
      <div class="status">অনলাইন</div>
    </div>
  </header>

  <div id="messages"></div>
  <div id="suggestions"></div>

  <form id="form">
    <input id="input" placeholder="বাংলায় প্রশ্ন লিখুন..." autocomplete="off" maxlength="1000">
    <button class="send" id="send" aria-label="পাঠান">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 12h14M13 6l6 6-6 6"/>
      </svg>
    </button>
  </form>
  <p class="note">এটি সাধারণ তথ্য, ব্যক্তিগত আর্থিক পরামর্শ নয়।</p>
</div>

<script>
  const messages = document.getElementById("messages");
  const suggestions = document.getElementById("suggestions");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("send");

  const WELCOME = "স্বাগতম! আমি Beneco-র বাংলা AI বন্ধু। মর্টগেজ, ইন্স্যুরেন্স বা ব্যবসার লোন নিয়ে যেকোনো প্রশ্ন করুন।";
  const SUGGESTIONS = [
    "প্রথমবার বাড়ি কিনতে চাই",
    "ইসলামিক মর্টগেজ আছে?",
    "ব্যবসার জন্য লোন দরকার",
  ];

  // turn "https://benecofinance.co.uk/remortgage/" into "remortgage"
  function sourceLabel(url) {
    const path = new URL(url).pathname.replace(/^\/|\/$/g, "");
    return path ? path.replace(/-/g, " ") : "benecofinance.co.uk";
  }

  function addMessage(text, who, sources = []) {
    const div = document.createElement("div");
    div.className = `msg ${who}`;
    div.textContent = text;                       // plain text only, safe
    if (sources.length) {
      const box = document.createElement("div");
      box.className = "sources";
      box.textContent = "সূত্র:";
      sources.forEach(url => {
        const a = document.createElement("a");
        a.href = url;
        a.target = "_blank";
        a.rel = "noopener";
        a.textContent = url.replace("https://", "");
        box.appendChild(a);
      });
      div.appendChild(box);
    }
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
    return div;
  }

  function showTyping() {
    const div = document.createElement("div");
    div.className = "msg bot typing";
    div.innerHTML = "<span></span><span></span><span></span>";
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
    return div;
  }

  function setBusy(busy) {
    input.disabled = busy;
    sendBtn.disabled = busy;
  }

  async function ask(question) {
    question = question.trim();
    if (!question) return;

    addMessage(question, "user");
    input.value = "";
    suggestions.style.display = "none";
    setBusy(true);
    const typing = showTyping();

    try {
      const res = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: question }),
      });
      const data = await res.json();
      typing.remove();

      if (!res.ok) {
        const detail = typeof data.detail === "string"
          ? data.detail
          : "দুঃখিত, একটি সমস্যা হয়েছে। আবার চেষ্টা করুন।";
        addMessage(detail, "bot");
        return;
      }
      addMessage(data.answer, "bot", data.sources);
    } catch (err) {
      typing.remove();
      addMessage("সংযোগে সমস্যা হয়েছে। আবার চেষ্টা করুন।", "bot");
    } finally {
      setBusy(false);
      input.focus();
    }
  }

  addMessage(WELCOME, "bot");
  SUGGESTIONS.forEach(text => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.textContent = text;
    btn.onclick = () => ask(text);
    suggestions.appendChild(btn);
  });

  form.addEventListener("submit", e => {
    e.preventDefault();
    ask(input.value);
  });
</script>
</body>
</html>
