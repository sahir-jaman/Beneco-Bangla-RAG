# Beneco Bangla RAG — settings
# Change values here instead of editing the code.

# --- Website crawling ---
website:
  sitemap_url: "https://benecofinance.co.uk/sitemap_index.xml"
  extra_urls: []                  # pages missing from the sitemap
  skip_url_patterns:              # pages with no useful text
    - "calculator"
    - "cookie-policy"
    - "privacy-notice"
    - "accessibility-statement"
    - "/blog/"
  request_delay_seconds: 1        # be polite to the server

# --- Chunking ---
chunking:
  chunk_size: 800
  chunk_overlap: 150
  min_chunk_chars: 80 

# --- Embeddings ---
embedding:
  model: "BAAI/bge-m3"

# --- Retrieval ---
retrieval:
  top_k: 6
  similarity_threshold: 0.45
  max_chunks_per_page: 2
  source_min_score: 0.55        # only show sources this relevant
  source_priority:
    manual: 3
    page: 2
    blog: 1

# --- LLM ---
llm:
  provider: "huggingface"
  model: "openai/gpt-oss-120b"
  base_url: "https://router.huggingface.co/v1"
  api_key_env: "HF_TOKEN"
  temperature: 0.1
  max_tokens: 4000
  rewrite_max_tokens: 1500

# --- Business rules ---
rules:
  show_prices: false              # set true only if Beneco approves
  answer_language: "bn"           # Bangla
  fallback_message: "দুঃখিত, এই মুহূর্তে উত্তর দিতে পারছি না। আপনার ফোন নম্বর দিলে Beneco-র একজন পরামর্শদাতা আপনাকে কল করবেন, অথবা 020 8050 2478 নম্বরে কল করুন।"

# --- Contact details (inserted into the system prompt) ---
contact:
  phone: "020 8050 2478"
  email: "info@benecofinance.co.uk"
  booking_link: "https://link.thetopgeek.com/widget/booking/9HaZrxKaqubgZSEQgJl9"


# --- Cleaning ---
cleaning:
  boilerplate_min_pages: 3   # a line on this many pages or more counts as shared
  min_words_to_index: 50     # pages shorter than this are not indexed



# --- Vector database ---
vectorstore:
  path: "chroma_db"          # folder inside the project
  collection: "beneco"


# --- Memory ---
memory:
  max_history_messages: 6      # earlier messages the bot reads (3 questions + 3 answers)
  keep_days: 30                # how long the browser keeps the chat
